# ==============================================================================
# 文津·选刊助手 (Wenjin-Lens) 生产级 Nginx 反向代理与多服务网关配置方案
# ==============================================================================
# 本配置文件涵盖两套企业级部署方案：
# 方案一：【云端生产拓扑】多服务集成网关 + /wenjin/ 子路径挂载 (实测稳定运行)
# 方案二：【独立域名拓扑】专用二级域名直接反代 (如 wenjin.yourdomain.com)
# ==============================================================================

# ------------------------------------------------------------------------------
# 方案一：多服务集成网关 + /wenjin/ 子路径反向代理 (生产网关拓扑)
# 对应服务器路径：/etc/nginx/sites-available/default
# 对应域名环境：gateway.yourdomain.com / YOUR_SERVER_IP
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 主机绑定域名与公网 IP 监听 (请替换为您实际解析的域名与服务器IP)
    server_name gateway.yourdomain.com 127.0.0.1 _;
    charset utf-8;

    # 客户端上传与请求体限制 (满足 Excel 决策台账与论文元数据解析)
    client_max_body_size 20M;

    # Gzip 高性能数据传输压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. 根路径：多系统统一导航门户网关
    root /var/www/portal;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    # 2. 文津·选刊助手 (Wenjin-Lens) 子路径挂载
    # 说明：前端 api.js 已内置自动侦测 /wenjin/ 前缀，后端容器映射在宿主机 8001 端口
    location /wenjin/ {
        # 注意：结尾斜杠 / 触发 Nginx URI 剥离，将 /wenjin/api/... 重写为容器内的 /api/...
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;

        # WebSocket 与连接升级头 (支持 SSE 流式查证 / 进度长轮询)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 真实客户端 IP 与协议透传
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 联网语义查证与跨库查询超时保障 (默认 60s)
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 3. 静态资源长效缓存 (加速前端 Zero-CDN 本地库加载)
    location ~* ^/wenjin/(libs|css|js|images)/ {
        proxy_pass http://127.0.0.1:8001;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --------------------------------------------------------------------------
    # 宿主机上共存的其它学术/微服务参考映射 (端口隔离规范)
    # --------------------------------------------------------------------------
    # 伤寒论 Web (端口 8080)
    location /shanghanlun/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 规培排版系统 (Streamlit WebSocket 端口 8501)
    location /guipei/ {
        proxy_pass http://127.0.0.1:8501/guipei/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # 外部微服务 API (端口 8000)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 安全防御：禁止访问隐藏文件与系统敏感目录
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}


